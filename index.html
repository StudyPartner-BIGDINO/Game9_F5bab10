<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Game Level Selection</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0b0d10">
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS / Apple Web App Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Game Map">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Instant skip check for 1-hour Cloud Intro cooldown -->
    <script>
        (function() {
            const lastIntroTime = Number(localStorage.getItem("introLastPlayedAt"));
            const introCooldown = 60 * 60 * 1000; // 1 hour cooldown
            const shouldShowIntro = !lastIntroTime || (Date.now() - lastIntroTime >= introCooldown);
            if (!shouldShowIntro) {
                document.documentElement.classList.add('intro-played');
            }
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #0b0d10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* Modern dynamic viewport height */
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 0;
            margin: 0;
        }

        /* Fullscreen Loading Screen with Fantasy Theme */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #0b0d10;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            opacity: 1;
            visibility: visible;
        }

        .loading-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        /* Stylized Game Title Logo */
        .game-logo {
            font-size: 2rem;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 0 20px rgba(255, 140, 0, 0.3);
            font-family: Georgia, serif;
            font-weight: bold;
            animation: logoPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes logoPulse {
            0% {
                transform: scale(0.98);
                text-shadow: 0 0 10px rgba(255, 215, 0, 0.4), 0 0 20px rgba(255, 140, 0, 0.2);
            }
            100% {
                transform: scale(1.02);
                text-shadow: 0 0 15px rgba(255, 215, 0, 0.7), 0 0 30px rgba(255, 140, 0, 0.5);
            }
        }

        /* Spinner Container */
        .spinner-container {
            position: relative;
            width: 70px;
            height: 70px;
            margin-bottom: 1.5rem;
        }

        /* Golden Fantasy Spinner */
        .fantasy-spinner {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 215, 0, 0.15);
            border-top-color: #ffd700;
            border-bottom-color: #ffd700;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Loading Label and Percentage */
        .loading-text-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            color: #e0e4eb;
            letter-spacing: 2px;
            margin-bottom: 0.8rem;
            font-family: monospace, sans-serif;
        }

        .loading-label {
            font-weight: 300;
        }

        .loading-percentage {
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        /* Progress Bar Container */
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        /* Progress Bar Active Fill */
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #b8860b, #ffd700, #b8860b);
            background-size: 200% 100%;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            border-radius: 3px;
            transition: width 0.1s linear;
            animation: progressGlow 1.5s linear infinite;
        }

        @keyframes progressGlow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        /* --- REDESIGNED SEAMLESS PORTRAIT CLOUD INTRO OVERLAY --- */
        .cloud-intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            pointer-events: auto;
            transition: opacity 0.5s ease-out 1.6s, visibility 0.5s ease-out 1.6s, filter 0.3s ease-out;
        }

        /* Fast suppression of cloud screen if within 1-hour cooldown */
        .intro-played .cloud-intro-screen {
            display: none !important;
        }

        /* Click brightening transition flash */
        .cloud-intro-screen.separating {
            filter: brightness(1.8) saturate(1.1);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }

        /* Soft sunlight glow element behind clouds */
        .sunlight-glow {
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 80%;
            background: radial-gradient(circle, rgba(255, 235, 150, 0.28) 0%, rgba(255, 215, 0, 0.08) 55%, transparent 80%);
            pointer-events: none;
            z-index: 0;
            mix-blend-mode: screen;
            animation: sunlightBreathe 6s infinite alternate ease-in-out;
        }

        @keyframes sunlightBreathe {
            0% { opacity: 0.75; }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        /* Three independent, seamless transparent PNG cloud layers */
        .cloud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: repeat;
            pointer-events: none;
            will-change: background-position, transform, opacity;
        }

        /* Layer 1: Large soft background clouds (Very slow drift) */
        .cloud-layer-1 {
            background-image: url('https://pngimg.com/uploads/cloud/cloud_PNG2.png');
            background-size: 140% auto;
            opacity: 0.9;
            z-index: 1;
            animation: driftSlow 130s linear infinite;
            transition: transform 1.8s cubic-bezier(0.25, 1, 0.5, 1) 0.2s, 
                        opacity 1.6s cubic-bezier(0.25, 1, 0.5, 1) 0.2s;
        }

        /* Layer 2: Medium foreground clouds (Medium drift) */
        .cloud-layer-2 {
            background-image: url('https://pngimg.com/uploads/cloud/cloud_PNG18.png');
            background-size: 100% auto;
            opacity: 0.85;
            z-index: 2;
            animation: driftMedium 90s linear infinite;
            transition: transform 1.6s cubic-bezier(0.25, 1, 0.5, 1) 0.2s, 
                        opacity 1.4s cubic-bezier(0.25, 1, 0.5, 1) 0.2s;
        }

        /* Layer 3: Small thin clouds (Slightly faster drift) */
        .cloud-layer-3 {
            background-image: url('https://pngimg.com/uploads/cloud/cloud_PNG3.png');
            background-size: 65% auto;
            opacity: 0.75;
            z-index: 3;
            animation: driftFast 50s linear infinite;
            transition: transform 1.3s cubic-bezier(0.25, 1, 0.5, 1) 0.2s, 
                        opacity 1.1s cubic-bezier(0.25, 1, 0.5, 1) 0.2s;
        }

        @keyframes driftSlow {
            0% { background-position: 0px 0px; }
            100% { background-position: 2000px 0px; }
        }

        @keyframes driftMedium {
            0% { background-position: 0px 0px; }
            100% { background-position: -2000px 150px; }
        }

        @keyframes driftFast {
            0% { background-position: 0px 0px; }
            100% { background-position: 1000px -100px; }
        }

        /* Parting cloud separation directions */
        .cloud-intro-screen.separating .cloud-layer-1 {
            transform: translate3d(-100%, 0, 0) scale(1.1);
            opacity: 0;
        }

        .cloud-intro-screen.separating .cloud-layer-2 {
            transform: translate3d(100%, 0, 0) scale(1.1);
            opacity: 0;
        }

        .cloud-intro-screen.separating .cloud-layer-3 {
            transform: translate3d(0, -100%, 0) scale(1.1);
            opacity: 0;
        }

        /* Intro Screen UI container */
        .intro-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.9s ease-out;
        }

        .cloud-intro-screen.separating .intro-content {
            transform: scale(1.12);
            opacity: 0;
            pointer-events: none;
        }

        /* Ornate start button wrapper for cloud wisps */
        .button-wrapper {
            position: relative;
            display: inline-block;
        }

        /* Tiny cloud wisps drifting across the start button */
        .wisp {
            position: absolute;
            width: 80px;
            height: 40px;
            background-image: url('https://pngimg.com/uploads/cloud/cloud_PNG13.png');
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
            opacity: 0.55;
            mix-blend-mode: screen;
            z-index: 13;
        }

        .wisp-1 {
            top: -12px;
            left: -35px;
            animation: wispDrift1 14s infinite linear;
        }

        .wisp-2 {
            bottom: -15px;
            right: -35px;
            animation: wispDrift2 18s infinite linear;
        }

        @keyframes wispDrift1 {
            0% { transform: translate3d(0, 0, 0) scale(0.75); opacity: 0; }
            10% { opacity: 0.55; }
            90% { opacity: 0.55; }
            100% { transform: translate3d(210px, 4px, 0) scale(0.95); opacity: 0; }
        }

        @keyframes wispDrift2 {
            0% { transform: translate3d(0, 0, 0) scale(0.95); opacity: 0; }
            15% { opacity: 0.45; }
            85% { opacity: 0.45; }
            100% { transform: translate3d(-210px, -4px, 0) scale(0.75); opacity: 0; }
        }

        /* Elegant Ornate Medieval Start Button */
        .intro-start-btn {
            position: relative;
            padding: 16px 54px;
            background: linear-gradient(135deg, #8a640f 0%, #b8860b 25%, #ffd700 50%, #b8860b 75%, #8a640f 100%);
            background-size: 200% 100%;
            border: 2px solid #ffd700;
            border-radius: 4px;
            color: #0b0d10;
            font-family: Georgia, serif;
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.6);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
            transition: border-color 0.3s, color 0.3s, background-position 0.4s;
            z-index: 12;
            
            clip-path: polygon(
                0% 4px, 4px 0%, calc(100% - 4px) 0%, 100% 4px,
                100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0% calc(100% - 4px)
            );
            animation: buttonFloat 3s infinite alternate ease-in-out;
        }

        @keyframes buttonFloat {
            0% {
                transform: translateY(0);
                box-shadow: 0 6px 15px rgba(184, 134, 11, 0.3), inset 0 0 8px rgba(255, 255, 255, 0.4);
            }
            100% {
                transform: translateY(-6px);
                box-shadow: 0 12px 25px rgba(184, 134, 11, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.7);
            }
        }

        @media (hover: hover) {
            .intro-start-btn:hover {
                background-position: 100% 0;
                border-color: #ffffff;
                box-shadow: 0 15px 30px rgba(255, 215, 0, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.8);
                color: #000000;
            }
        }

        .intro-start-btn:active {
            transform: translateY(2px) scale(0.97) !important;
            box-shadow: 0 4px 10px rgba(184, 134, 11, 0.5) !important;
            transition: transform 0.05s ease;
        }

        /* --- GAME VIEWPORT ADJUSTMENTS --- */
        .game-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            pointer-events: none;
        }

        .intro-played .game-wrapper {
            pointer-events: auto !important;
        }

        .game-wrapper.interactive {
            pointer-events: auto;
        }

        .map-container {
            position: relative;
            display: inline-block;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            overflow: visible;
            transform-origin: center center;
            will-change: transform;
            transform-style: preserve-3d;
        }

        @media (max-width: 768px) {
            .map-container {
                border-radius: 0;
                box-shadow: none;
            }
        }

        .map-bg {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .interactive-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .mission-badge {
            position: absolute;
            width: 9.3%; 
            aspect-ratio: 1 / 1;
            transform: translate3d(-50%, -50%, 0) scale(1);
            transform-origin: center center;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
            overflow: visible; 
            opacity: 1;
            
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            will-change: transform;
            
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), 
                        filter 0.25s cubic-bezier(0.25, 1, 0.5, 1),
                        box-shadow 0.25s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .mission-badge[data-state="available"] {
            animation: availablePulse 2.2s infinite alternate ease-in-out;
        }

        @keyframes availablePulse {
            0% {
                filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.45));
            }
            100% {
                filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.9)) brightness(1.04);
            }
        }

        .mission-badge[data-state="locked"] {
            filter: brightness(0.8);
            cursor: not-allowed;
        }

        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 2;
        }

        .inner-glow-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
            animation: innerGlowBreathe var(--glow-speed, 3s) infinite ease-in-out;
            animation-delay: var(--glow-delay, 0s);
            z-index: 1;
        }

        @keyframes innerGlowBreathe {
            0% {
                opacity: 0.7;
                box-shadow: 0 0 10px rgba(255, 180, 0, 0.35), inset 0 0 8px rgba(255, 180, 0, 0.15);
            }
            100% {
                opacity: 0.95;
                box-shadow: 0 0 18px rgba(255, 215, 0, 0.6), inset 0 0 14px rgba(255, 215, 0, 0.35);
            }
        }

        .rotating-halo-layer {
            position: absolute;
            top: -6%;
            left: -6%;
            width: 112%;
            height: 112%;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: rgba(255, 215, 0, 0.85);
            border-bottom-color: rgba(255, 180, 0, 0.85);
            border-left-color: rgba(255, 215, 0, 0.25);
            border-right-color: rgba(255, 140, 0, 0.25);
            pointer-events: none;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.5));
            animation: haloRotate var(--halo-speed, 10s) linear infinite;
            animation-delay: var(--halo-delay, 0s);
            z-index: 1;
        }

        @keyframes haloRotate {
            0% {
                transform: rotate(var(--halo-start-angle, 0deg));
            }
            100% {
                transform: rotate(calc(var(--halo-start-angle, 0deg) + 360deg));
            }
        }

        .sparkles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .sparkle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #fff 15%, rgba(255, 215, 0, 0.95) 55%, transparent 100%);
            clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
            pointer-events: none;
            opacity: 0;
            animation: sparklePulse var(--sp-duration, 3.2s) infinite ease-in-out;
            animation-delay: var(--sp-delay, 0s);
        }

        @keyframes sparklePulse {
            0%, 100% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(var(--sp-angle, 0deg)) translate(53%) scale(0);
            }
            40%, 60% {
                opacity: 0.9;
                transform: translate(-50%, -50%) rotate(var(--sp-angle, 0deg)) translate(53%) scale(var(--sp-scale, 1));
            }
        }

        .click-burst-layer {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.8) 0%, rgba(255, 140, 0, 0.4) 40%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            z-index: 3;
            transform: scale(0.5);
        }

        .mission-badge.burst-active .click-burst-layer {
            animation: clickFlash 0.4s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes clickFlash {
            0% {
                opacity: 0;
                transform: scale(0.4);
            }
            20% {
                opacity: 1;
                transform: scale(1.1);
                filter: brightness(1.5);
            }
            100% {
                opacity: 0;
                transform: scale(1.4);
            }
        }

        .mission-badge.burst-active .rotating-halo-layer {
            animation: haloBurst 0.4s ease-out forwards !important;
        }

        @keyframes haloBurst {
            0% {
                transform: rotate(0deg) scale(1);
                filter: drop-shadow(0 0 15px rgba(255, 215, 0, 1)) brightness(2.2);
                border-width: 3px;
            }
            100% {
                transform: rotate(180deg) scale(1.25);
                filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0)) brightness(1);
                border-width: 1.5px;
                opacity: 0.5;
            }
        }

        .badge-img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .mission-badge[data-champion="true"] {
            animation: championBadgePulse 6s ease-in-out infinite !important;
            z-index: 5;
        }

        @keyframes championBadgePulse {
            0%, 88%, 100% {
                transform: translate3d(-50%, -50%, 0) scale(1);
            }
            94% {
                transform: translate3d(-50%, -50%, 0) scale(1.04);
            }
        }

        .champion-glow-layer {
            position: absolute;
            top: -16%;
            left: -16%;
            width: 132%;
            height: 132%;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
            z-index: 1;
            animation: championGlowBreathe 3.5s ease-in-out infinite alternate;
        }

        @keyframes championGlowBreathe {
            0% {
                opacity: 0.65;
                box-shadow: 0 0 16px rgba(255, 215, 0, 0.55), 0 0 30px rgba(255, 180, 0, 0.35), inset 0 0 12px rgba(255, 215, 0, 0.35);
            }
            100% {
                opacity: 0.95;
                box-shadow: 0 0 32px rgba(255, 215, 0, 0.95), 0 0 50px rgba(255, 165, 0, 0.65), inset 0 0 22px rgba(255, 215, 0, 0.6);
            }
        }

        .champion-shimmer-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            pointer-events: none;
            overflow: hidden;
            z-index: 4;
        }

        .champion-shimmer-layer::after {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: linear-gradient(
                120deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 30%,
                rgba(255, 245, 160, 0.9) 50%,
                rgba(255, 255, 255, 0.3) 70%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: translateX(-150%) rotate(25deg);
            mix-blend-mode: color-dodge;
            animation: championShimmerSweep 10s ease-in-out infinite;
        }

        @keyframes championShimmerSweep {
            0%, 88% {
                transform: translateX(-150%) rotate(25deg);
                opacity: 0;
            }
            89% {
                opacity: 1;
            }
            96% {
                transform: translateX(150%) rotate(25deg);
                opacity: 1;
            }
            97%, 100% {
                transform: translateX(150%) rotate(25deg);
                opacity: 0;
            }
        }

        .champion-sparkle {
            position: absolute;
            width: 7px;
            height: 7px;
            background: radial-gradient(circle, #ffffff 20%, #ffd700 70%, transparent 100%);
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0 0 5px #ffd700);
            animation: championSparkleAnim 1.5s ease-out forwards;
        }

        @keyframes championSparkleAnim {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) translateY(0) scale(0.2);
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(-6px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) translateY(-20px) scale(0.2);
            }
        }

        @media (hover: hover) {
            .mission-badge[data-state="available"]:hover,

                animation: none;
                transform: translate3d(-50%, calc(-50% - 2px), 0) scale(1.05);
                filter: drop-shadow(0 4px 12px rgba(255, 215, 0, 0.6)) brightness(1.08);

                box-shadow: 0 0 24px rgba(255, 215, 0, 0.85), inset 0 0 18px rgba(255, 215, 0, 0.4);
                filter: brightness(1.15);
            }

            .mission-badge[data-state="completed"]:hover .rotating-halo-layer {
                border-width: 2px;
                filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.85)) brightness(1.2);
                animation-duration: calc(var(--halo-speed, 10s) * 0.6);

            z-index: 10;

        @keyframes badgeBounceAndGlow {
            0% {
                transform: translate3d(-50%, calc(-50% - 2px), 0) scale(1.05);
                filter: drop-shadow(0 4px 12px rgba(255, 215, 0, 0.6)) brightness(1.08);
            }
            40% {
                transform: translate3d(-50%, -50%, 0) scale(1.10); 
                filter: drop-shadow(0 6px 20px rgba(255, 215, 0, 0.85)) brightness(1.15);
            }
            100% {
                transform: translate3d(-50%, -50%, 0) scale(1.10);
                filter: drop-shadow(0 5px 16px rgba(255, 215, 0, 0.75)) brightness(1.10);
            }
        }

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.25) 30%,
                rgba(255, 223, 0, 0.85) 50%,
                rgba(255, 255, 255, 0.25) 70%,

            background-size: 300% 100%;

            pointer-events: none;

        // --- HELPER FOR 1-HOUR CLOUD INTRO COOLDOWN SYSTEM ---
        function shouldShowCloudIntro() {
            const lastIntroTime = Number(localStorage.getItem("introLastPlayedAt"));
            const introCooldown = 60 * 60 * 1000;
            return !lastIntroTime || (Date.now() - lastIntroTime >= introCooldown);
        }

        // --- REUSABLE PROGRESSION SYSTEM ENGINE ---
        const GameProgression = {
            STORAGE_KEY: 'game_level_progression_v1',

            getProgress() {
                try {
                    const saved = localStorage.getItem(this.STORAGE_KEY);
                    if (saved) {
                        return JSON.parse(saved);
                    }
                } catch (e) {
                    console.error("Local storage read error", e);
                }
                return this.getInitialState();
            },

            getInitialState() {
                return {
                    levels: {
                        1: { unlocked: true, completed: false, stars: 0, score: 0 }
                    },
                    achievements: [],
                    stats: {
                        totalScore: 0,
                        levelsCompleted: 0
                    }
                };
            },

            save(progress) {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(progress));
                } catch (e) {
                    console.error("Local storage save error", e);
                }
            },

            isUnlocked(levelId) {
                const id = parseInt(levelId);
                if (id === 1) return true;
                const progress = this.getProgress();
                return !!(progress.levels[id] && progress.levels[id].unlocked);
            },

            isCompleted(levelId) {
                const id = parseInt(levelId);
                const progress = this.getProgress();
                return !!(progress.levels[id] && progress.levels[id].completed);
            },

            completeLevel(levelId, data = {}) {
                const id = parseInt(levelId);
                const progress = this.getProgress();

                if (!progress.levels[id]) {
                    progress.levels[id] = {};
                }
                progress.levels[id].completed = true;
                progress.levels[id].unlocked = true;

                if (data.stars !== undefined) progress.levels[id].stars = data.stars;
                if (data.score !== undefined) progress.levels[id].score = data.score;

                const nextId = id + 1;
                if (nextId <= 9) {
                    if (!progress.levels[nextId]) {
                        progress.levels[nextId] = {};
                    }
                    progress.levels[nextId].unlocked = true;
                }

                let totalScore = 0;
                let completedCount = 0;
                Object.keys(progress.levels).forEach(k => {
                    const lvl = progress.levels[k];
                    if (lvl.completed) completedCount++;
                    if (lvl.score) totalScore += lvl.score;
                });
                progress.stats.totalScore = totalScore;
                progress.stats.levelsCompleted = completedCount;

                this.save(progress);

                if (id === 9) {
                    localStorage.setItem('level9JustCompleted', 'true');
                }

                return progress;
            },

            resetProgression() {
                const init = this.getInitialState();
                this.save(init);
                localStorage.removeItem("introLastPlayedAt");
                localStorage.removeItem("introPlayed");
                localStorage.removeItem("level9JustCompleted");
                localStorage.removeItem("level9Celebrated");
                sessionStorage.removeItem("introPlayed");
                return init;
            }
        };

            bgMusic.volume = 0;
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    const targetVolume = 0.35;
                    const startTime = performance.now();
                    function step(now) {
                        const elapsed = now - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        bgMusic.volume = progress * targetVolume;
                        if (progress < 1) {
                            requestAnimationFrame(step);
                        }
                    }
                    requestAnimationFrame(step);
                }).catch(err => {
                    console.warn("Autoplay blocked. Registering interaction fallbacks.", err);
                    setupAutoplayFallback();

            }

        let isAutoplayFallbackRegistered = false;

            if (isAutoplayFallbackRegistered) return;
            isAutoplayFallbackRegistered = true;

            const startOnInteraction = () => {
                ensureBGMPlaying();
                cleanupListeners();
            };

            const cleanupListeners = () => {
                window.removeEventListener('click', startOnInteraction);
                window.removeEventListener('touchend', startOnInteraction);
                window.removeEventListener('pointerdown', startOnInteraction);
                isAutoplayFallbackRegistered = false;
            };

            window.addEventListener('click', startOnInteraction, { once: true });
            window.addEventListener('touchend', startOnInteraction, { once: true });
            window.addEventListener('pointerdown', startOnInteraction, { once: true });
        }

        function ensureBGMPlaying() {
            if (shouldShowCloudIntro()) {
                return;

            const targetVolume = 0.35;

            if (!bgMusic.paused && bgMusic.volume > 0) {
                return;
            }

            bgMusic.volume = targetVolume;
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    bgMusic.volume = targetVolume;
                }).catch(err => {
                    console.warn("BGM resume blocked:", err);
                    setupAutoplayFallback();
                });
            }
        }

        function fadeOutBGM(duration = 400) {
            return new Promise((resolve) => {
                const startVolume = bgMusic.volume;
                const startTime = performance.now();
                function step(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    bgMusic.volume = startVolume * (1 - progress);
                    if (progress < 1) {
                        requestAnimationFrame(step);
                    } else {
                        bgMusic.pause();
                        resolve();
                    }
                }
                requestAnimationFrame(step);
            });
        }

        function setInitialCamera() {
            const isMobile = window.innerWidth <= 768;
            if (isMobile) {
                targetCameraScale = 1.25;
                const scaledH = mapH * targetCameraScale;
                const limitY = Math.max(0, (scaledH - viewH) / 2);
                targetCameraY = limitY;
                targetCameraX = 0;
            } else {
                targetCameraScale = 1.0;
                targetCameraX = 0;
                targetCameraY = 0;
            }

            if (isInitialLoad) {
                currentCameraScale = targetCameraScale;
                currentCameraX = targetCameraX;
                currentCameraY = targetCameraY;

            }
            
            clampBounds();
        }

        function updateMapDimensions() {
            viewW = viewport.clientWidth;
            viewH = viewport.clientHeight;

            const mapAspectRatio = 1000 / 1482;
            const viewAspectRatio = viewW / viewH;

            const isMobile = window.innerWidth <= 768;

            if (isMobile) {
                if (viewAspectRatio > mapAspectRatio) {
                    mapW = viewW;
                    mapH = viewW / mapAspectRatio;
                } else {
                    mapH = viewH;
                    mapW = viewH * mapAspectRatio;
                }
            } else {
                if (viewAspectRatio > mapAspectRatio) {
                    mapH = viewH;
                    mapW = viewH * mapAspectRatio;
                } else {
                    mapW = viewW;
                    mapH = viewW / mapAspectRatio;
                }
            }

            mapContainer.style.width = `${mapW}px`;
            mapContainer.style.height = `${mapH}px`;

            if (isInitialLoad) {
                setInitialCamera();
            } else {
                clampBounds();
            }
        }

        let lastWidth = window.innerWidth;
        let lastHeight = window.innerHeight;

            const currentWidth = window.innerWidth;
            const currentHeight = window.innerHeight;
            
            if (Math.abs(currentWidth - lastWidth) > 5 || Math.abs(currentHeight - lastHeight) > 15) {
                lastWidth = currentWidth;
                lastHeight = currentHeight;
                updateMapDimensions();
            }
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(updateMapDimensions, 150);
        });

        const lerp = (start, end, amt) => (1 - amt) * start + amt * end;

        function clampBounds() {
            if (mapW === 0 || mapH === 0) return;

            const scaledW = mapW * targetCameraScale;
            const scaledH = mapH * targetCameraScale;

            const limitX = Math.max(0, (scaledW - viewW) / 2);
            const limitY = Math.max(0, (scaledH - viewH) / 2);

            if (scaledW <= viewW) {
                targetCameraX = 0;
            } else {
                targetCameraX = Math.max(-limitX, Math.min(limitX, targetCameraX));
            }

            if (scaledH <= viewH) {
                targetCameraY = 0;
            } else {
                targetCameraY = Math.max(-limitY, Math.min(limitY, targetCameraY));
            }
        }

        function zoomToPoint(zoomCenterViewportX, zoomCenterViewportY, newScale) {
            newScale = Math.max(1.0, Math.min(2.0, newScale));
            if (newScale === targetCameraScale) return;

            const px = zoomCenterViewportX - viewW / 2;
            const py = zoomCenterViewportY - viewH / 2;

            const scaleRatio = newScale / targetCameraScale;
            targetCameraX = px - (px - targetCameraX) * scaleRatio;

            targetCameraScale = newScale;

            clampBounds();

                pressedUIButton = null;
                dragExceeded = true;

                const p1 = activePointers[0];
                const p2 = activePointers[1];
                initialPinchDist = Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
                initialPinchScale = targetCameraScale;
                pinchCenterX = (p1.clientX + p2.clientX) / 2;
                pinchCenterY = (p1.clientY + p2.clientY) / 2;
            }
            viewport.setPointerCapture(e.pointerId);
        });

        viewport.addEventListener('pointermove', (e) => {
            const idx = activePointers.findIndex(p => p.pointerId === e.pointerId);
            if (idx !== -1) {
                activePointers[idx] = e;
            }

            if (!isPointerDown) return;

            if (activePointers.length === 1) {
                const p = activePointers[0];
                const dx = p.clientX - startX;
                const dy = p.clientY - startY;

                if (Math.hypot(p.clientX - startX, p.clientY - startY) > 8) {
                    dragExceeded = true;
                }

                if (dragExceeded) {
                    const scaledW = mapW * targetCameraScale;
                    const scaledH = mapH * targetCameraScale;

                    if (scaledW > viewW || scaledH > viewH) {
                        targetCameraX = startTargetCameraX + dx;
                        targetCameraY = startTargetCameraY + dy;
                        clampBounds();

                        const now = performance.now();
                        const dt = now - lastPointerTime;
                        if (dt > 0) {
                            vx = (p.clientX - lastPointerX) / dt;
                            vy = (p.clientY - lastPointerY) / dt;
                        }
                        lastPointerX = p.clientX;
                        lastPointerY = p.clientY;
                        lastPointerTime = now;
                    } else {
                        vx = 0;
                        vy = 0;
                    }
                }
            } else if (activePointers.length === 2) {
                dragExceeded = true; 
                const p1 = activePointers[0];
                const p2 = activePointers[1];
                const currentDist = Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
                const scaleFactor = currentDist / initialPinchDist;
                
                const nextScale = initialPinchScale * scaleFactor;
                const midX = (p1.clientX + p2.clientX) / 2;
                const midY = (p1.clientY + p2.clientY) / 2;
                
                zoomToPoint(midX, midY, nextScale);
            }
        });

        const handlePointerUp = (e) => {
            const idx = activePointers.findIndex(p => p.pointerId === e.pointerId);
            if (idx !== -1) {
                activePointers.splice(idx, 1);
            }

            if (activePointers.length === 0) {
                isPointerDown = false;
                
                if (!dragExceeded) {
                    vx = 0;
                    vy = 0;

                    if (pressedBadge) {
                        const badgeId = pressedBadge.getAttribute('data-level');
                        const state = pressedBadge.getAttribute('data-state');

                        if (state !== 'locked') {
                            const badgeData = BADGES.find(b => b.id == badgeId);

                            if (badgeData && !pressedBadge.classList.contains('clicked')) {
                                pressedBadge.classList.add('clicked');
                                
                                if (state === 'completed') {
                                    pressedBadge.classList.add('burst-active');
                                }

                                playClickSound();
                                fadeOutBGM(400);

                                setTimeout(() => {
                                    window.location.href = badgeData.level;
                                }, 400);
                            }
                        }
                    } else if (pressedUIButton) {
                        const buttonId = pressedUIButton.id;
                        playClickSound();
                        setTimeout(() => {
                            if (buttonId === 'btn-menu') {
                                openMenuModal();
                            } else if (buttonId === 'btn-achievement') {
                                AdventureRecord.open();
                            }
                        }, 100);
                    }
                } else {
                    const maxSpeed = 1.5;
                    vx = Math.max(-maxSpeed, Math.min(maxSpeed, vx));
                    vy = Math.max(-maxSpeed, Math.min(maxSpeed, vy));
                }

                pressedBadge = null;
                pressedUIButton = null;

            } else if (activePointers.length === 1) {
                const p = activePointers[0];
                startX = p.clientX;
                startY = p.clientY;
                startTargetCameraX = targetCameraX;
                startTargetCameraY = targetCameraY;
                lastPointerX = p.clientX;
                lastPointerY = p.clientY;
                lastPointerTime = performance.now();

                pressedBadge = null;
                pressedUIButton = null;
            }
            try {
                viewport.releasePointerCapture(e.pointerId);
            } catch (err) {}
        };

        viewport.addEventListener('pointerup', handlePointerUp);
        viewport.addEventListener('pointercancel', handlePointerUp);

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 0.1;
            const direction = e.deltaY < 0 ? 1 : -1;
            const nextScale = targetCameraScale + direction * zoomFactor;
            zoomToPoint(e.clientX, e.clientY, nextScale);
        }, { passive: false });

        let lastTapTime = 0;
        viewport.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.ui-button') || 
                e.target.closest('.menu-modal-content') || 
                e.target.closest('.victory-banner-container') || 
                e.target.closest('.adventure-modal-content') ||
                e.target.closest('.review-modal-content')) return;

            const currentTime = new Date().getTime();
            const tapDelay = currentTime - lastTapTime;
            if (tapDelay < 300 && tapDelay > 0) {
                handleDoubleTap(e.clientX, e.clientY);
                e.preventDefault();
            }
            lastTapTime = currentTime;
        });

        function handleDoubleTap(x, y) {
            const isMobile = window.innerWidth <= 768;
            const baseScale = isMobile ? 1.25 : 1.0;
            const zoomScale = 1.8;

            if (targetCameraScale > baseScale + 0.1) {
                zoomToPoint(x, y, baseScale);
            } else {
                zoomToPoint(x, y, zoomScale);
            }
        }

        function renderLoop() {
            const scaledW = mapW * targetCameraScale;
            const scaledH = mapH * targetCameraScale;

            if (!isPointerDown && (scaledW > viewW || scaledH > viewH)) {
                if (Math.abs(vx) > 0.01 || Math.abs(vy) > 0.01) {
                    targetCameraX += vx * 16; 
                    targetCameraY += vy * 16;
                    vx *= 0.88; 
                    vy *= 0.88;
                    clampBounds();
                } else {
                    vx = 0;
                    vy = 0;
                }
            }

            currentCameraScale = lerp(currentCameraScale, targetCameraScale, 0.15);
            currentCameraX = lerp(currentCameraX, targetCameraX, 0.15);
            currentCameraY = lerp(currentCameraY, targetCameraY, 0.15);

            mapContainer.style.transform = `translate3d(${currentCameraX}px, ${currentCameraY}px, 0) scale(${currentCameraScale})`;

            requestAnimationFrame(renderLoop);
        }

        requestAnimationFrame(renderLoop);

        // --- CHAMPION BADGE SPARKLE PARTICLE EMITTER ---
        let championSparkleTimer = null;

        function startChampionSparkleEmitter(badgeEl) {
            if (championSparkleTimer) return;

            function emitSparkles() {
                if (!document.body.contains(badgeEl) || badgeEl.getAttribute('data-champion') !== 'true') {
                    championSparkleTimer = null;
                    return;
                }

                const count = Math.floor(Math.random() * 3) + 2; 
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        if (!document.body.contains(badgeEl)) return;
                        const sparkle = document.createElement('div');
                        sparkle.className = 'champion-sparkle';
                        
                        const left = (Math.random() * 130 - 15).toFixed(1) + '%';
                        const top = (Math.random() * 130 - 15).toFixed(1) + '%';
                        sparkle.style.left = left;
                        sparkle.style.top = top;
                        
                        const dur = (1.2 + Math.random() * 0.6).toFixed(2) + 's';
                        sparkle.style.animationDuration = dur;

                        badgeEl.appendChild(sparkle);

                        sparkle.addEventListener('animationend', () => {
                            sparkle.remove();
                        });
                    }, i * 180);
                }

                const nextInterval = Math.floor(Math.random() * 3000) + 5000;
                championSparkleTimer = setTimeout(emitSparkles, nextInterval);
            }

            championSparkleTimer = setTimeout(emitSparkles, 1200);
        }

        // --- ARCHITECTURAL BADGE RENDERING SYSTEM ---

            const id = parseInt(levelId);
            
            if (GameProgression.isCompleted(id)) {
                return 'completed';
            }
            if (id === 1 || GameProgression.isUnlocked(id)) {

            return 'locked';

                                <path fill="#ffd700" d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z" />

                        const haloStartAngle = Math.floor(Math.random() * 360) + 'deg';
                        const glowDelay = -(Math.random() * 3).toFixed(2) + 's';
                        const glowSpeed = (2.2 + Math.random() * 1.8).toFixed(2) + 's';

                        el.style.setProperty('--halo-delay', haloDelay);
                        el.style.setProperty('--halo-speed', haloSpeed);
                        el.style.setProperty('--halo-start-angle', haloStartAngle);

                        el.style.setProperty('--glow-speed', glowSpeed);

                    let innerGlow = el.querySelector('.inner-glow-layer');
                    if (!innerGlow) {

                        el.appendChild(innerGlow);
                    }

                    let halo = el.querySelector('.rotating-halo-layer');
                    if (!halo) {
                        halo = document.createElement('div');
                        halo.className = 'rotating-halo-layer';
                        el.appendChild(halo);
                    }

                    let sparklesContainer = el.querySelector('.sparkles-container');
                    if (!sparklesContainer) {

                        for (let i = 1; i <= 3; i++) {

                            sparkle.className = `sparkle sp-${i}`;

                            const delay = -(Math.random() * 4).toFixed(2) + 's';
                            const duration = (2.5 + Math.random() * 2).toFixed(2) + 's';
                            const scale = (0.6 + Math.random() * 0.6).toFixed(2);
                            
                            sparkle.style.setProperty('--sp-angle', angle);
                            sparkle.style.setProperty('--sp-delay', delay);
                            sparkle.style.setProperty('--sp-duration', duration);
                            sparkle.style.setProperty('--sp-scale', scale);
                            
                            sparklesContainer.appendChild(sparkle);
                        }
                        el.appendChild(sparklesContainer);
                    }

                    let clickBurst = el.querySelector('.click-burst-layer');
                    if (!clickBurst) {
                        clickBurst = document.createElement('div');
                        clickBurst.className = 'click-burst-layer';
                        el.appendChild(clickBurst);
                    }

                    if (badgeId === '9') {
                        el.setAttribute('data-champion', 'true');

                        let champGlow = el.querySelector('.champion-glow-layer');
                        if (!champGlow) {
                            champGlow = document.createElement('div');
                            champGlow.className = 'champion-glow-layer';
                            el.appendChild(champGlow);
                        }

                        let champShimmer = el.querySelector('.champion-shimmer-layer');

                        const champShimmer = el.querySelector('.champion-shimmer-layer');
                        if (champShimmer) champShimmer.remove();
                    }

                    const innerGlow = el.querySelector('.inner-glow-layer');

                    el.style.removeProperty('--halo-speed');
                    el.style.removeProperty('--halo-start-angle');
                    el.style.removeProperty('--glow-delay');
                    el.style.removeProperty('--glow-speed');
                }
            });
        }

        // --- FINAL LEVEL CELEBRATION ---
        function checkAndStartFinalCelebration() {
            const justCompleted = localStorage.getItem('level9JustCompleted') === 'true';
            const isCompleted = GameProgression.isCompleted(9);
            const celebrated = localStorage.getItem('level9Celebrated') === 'true';

            if (justCompleted) {
                localStorage.removeItem('level9JustCompleted');
                localStorage.setItem('level9Celebrated', 'true');

                setTimeout(() => {
                    startFinalCelebration();
                }, 400);
            } else if (isCompleted && !celebrated) {
                localStorage.setItem('level9Celebrated', 'true');
                setTimeout(() => {
                    startFinalCelebration();
                }, 400);
            }
        }

        function startFinalCelebration() {
            const victoryModal = document.getElementById('victoryModal');
            const btnVictoryHome = document.getElementById('btnVictoryHome');

            if (victoryModal) {
                victoryModal.style.display = 'flex';
                victoryModal.offsetHeight;
                victoryModal.classList.add('active');
            }

            if (btnVictoryHome) {
                btnVictoryHome.onclick = () => {
                    playClickSound();
                    if (victoryModal) {
                        victoryModal.classList.remove('active');
                        setTimeout(() => {
                            victoryModal.style.display = 'none';
                        }, 400);
                    }
                };
            }

            const canvas = document.createElement('canvas');
            canvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;pointer-events:none;z-index:99999;';
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            const handleResize = () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            };
            window.addEventListener('resize', handleResize);

            const GOLD_PALETTE = [
                '#ffffff',
                '#fff3a0',
                '#ffd700',
                '#ffae00',
                '#ff8c00',
                '#e6a100'
            ];

            let animationFrameId = null;
            let startTime = performance.now();
            let rockets = [];
            let particles = [];
            let sparkles = [];

            const schedule = [
                { time: 0, pos: 'left' },
                { time: 100, pos: 'right' },
                { time: 400, pos: 'center' },
                { time: 800, pos: 'left' },
                { time: 1100, pos: 'right' },
                { time: 1500, pos: 'center' },
                { time: 1900, pos: 'left' },
                { time: 2100, pos: 'right' },
                { time: 2600, pos: 'center' },
                { time: 3000, pos: 'left' },
                { time: 3100, pos: 'center' },
                { time: 3200, pos: 'right' }
            ];

            let launchIndex = 0;

            function launchRocket(pos) {
                let startX;
                if (pos === 'left') {
                    startX = width * 0.25 + (Math.random() - 0.5) * (width * 0.08);
                } else if (pos === 'right') {
                    startX = width * 0.75 + (Math.random() - 0.5) * (width * 0.08);
                } else {
                    startX = width * 0.50 + (Math.random() - 0.5) * (width * 0.08);
                }

                const targetY = height * (0.12 + Math.random() * 0.22);
                const startY = height * 0.95;
                const speed = 12 + Math.random() * 3;

                rockets.push({
                    x: startX,
                    y: startY,
                    targetY: targetY,
                    vy: -speed,
                    color: GOLD_PALETTE[Math.floor(Math.random() * GOLD_PALETTE.length)]
                });
            }

            function explode(x, y) {
                const count = 55 + Math.floor(Math.random() * 20);
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 6.5 + 1.5;
                    const color = GOLD_PALETTE[Math.floor(Math.random() * GOLD_PALETTE.length)];
                    particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: 2.2 + Math.random() * 2.0,
                        color: color,
                        life: 1.0,
                        decay: 0.014 + Math.random() * 0.012
                    });
                }
            }

            function loop(now) {
                const elapsed = now - startTime;

                while (launchIndex < schedule.length && elapsed >= schedule[launchIndex].time) {
                    launchRocket(schedule[launchIndex].pos);
                    launchIndex++;
                }

                ctx.clearRect(0, 0, width, height);

                for (let i = rockets.length - 1; i >= 0; i--) {
                    const r = rockets[i];
                    r.y += r.vy;

                    ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
                    ctx.beginPath();
                    ctx.arc(r.x + (Math.random() - 0.5) * 2, r.y + 6, 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = r.color;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
                    ctx.fill();

                    if (r.y <= r.targetY || r.vy >= 0) {
                        explode(r.x, r.y);
                        rockets.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                    p.vy += 0.08;
                    p.life -= p.decay;

                    if (p.life <= 0) {
                        particles.splice(i, 1);
                        continue;
                    }

                    if (Math.random() < 0.25) {
                        sparkles.push({
                            x: p.x + (Math.random() - 0.5) * 4,
                            y: p.y + (Math.random() - 0.5) * 4,
                            vx: (Math.random() - 0.5) * 0.8,
                            vy: (Math.random() - 0.5) * 0.8 + 0.2,
                            radius: 1.0 + Math.random() * 1.2,
                            color: Math.random() < 0.5 ? '#ffffff' : '#ffd700',
                            life: 0.8,
                            decay: 0.03 + Math.random() * 0.03
                        });
                    }

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                for (let i = sparkles.length - 1; i >= 0; i--) {
                    const s = sparkles[i];
                    s.x += s.vx;
                    s.y += s.vy;
                    s.vy += 0.03;
                    s.life -= s.decay;

                    if (s.life <= 0) {
                        sparkles.splice(i, 1);
                        continue;
                    }

                    const alpha = Math.max(0, s.life * (Math.random() < 0.4 ? 0.3 : 1.0));
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = s.color;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                if (launchIndex >= schedule.length && rockets.length === 0 && particles.length === 0 && sparkles.length === 0) {
                    cleanup();
                } else if (elapsed > 6000) {
                    cleanup();
                } else {
                    animationFrameId = requestAnimationFrame(loop);
                }
            }

            function cleanup() {
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                window.removeEventListener('resize', handleResize);
                if (canvas && canvas.parentNode) {
                    canvas.parentNode.removeChild(canvas);
                }
                rockets = [];
                particles = [];
                sparkles = [];
            }

            animationFrameId = requestAnimationFrame(loop);
        }

        // --- ASSETS PRELOADER ENGINE ---
        function preloadAssets(assets, onProgress) {
            let loadedCount = 0;
            const total = assets.length;
            
            if (total === 0) return Promise.resolve();

            return Promise.all(assets.map(src => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.src = src;
                    img.onload = () => {
                        loadedCount++;
                        onProgress(loadedCount, total);
                        resolve();
                    };
                    img.onerror = () => {
                        loadedCount++;
                        onProgress(loadedCount, total);
                        resolve();
                    };
                });
            }));
        }

            const loadingScreen = document.getElementById('loadingScreen');
            const gameViewport = document.getElementById('gameViewport');

            const showIntro = shouldShowCloudIntro();

                if (cloudIntroScreen) cloudIntroScreen.remove();

                gameViewport.classList.add('interactive');

                ensureBGMPlaying();

            } else {
                localStorage.removeItem("introPlayed");

                const layers = document.querySelectorAll('.cloud-layer');
                layers.forEach(layer => {
                    const rx = Math.floor(Math.random() * 1200);
                    const ry = Math.floor(Math.random() * 800);
                    layer.style.backgroundPosition = `${rx}px ${ry}px`;
                });

                loadingScreen.classList.add('fade-out');

                const btnEnterMap = document.getElementById('btnEnterMap');
                const cloudIntroScreen = document.getElementById('cloudIntroScreen');

                btnEnterMap.addEventListener('click', () => {
                    localStorage.setItem("introLastPlayedAt", Date.now().toString());
                    playClickSound();
                    fadeInBGM();

                    cloudIntroScreen.classList.add('separating');

                    setTimeout(() => {
                        cloudIntroScreen.remove();
                        gameViewport.classList.add('interactive');
                        checkAndStartFinalCelebration();
                    }, 1800);
                });
            }

            console.log("GameProgression Engine loaded.");
        }

        window.addEventListener('pageshow', (e) => {
            updateBadgeStates();
            if (!shouldShowCloudIntro()) {
                ensureBGMPlaying();
                checkAndStartFinalCelebration();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                updateBadgeStates();
                if (!shouldShowCloudIntro()) {
                    ensureBGMPlaying();
                    checkAndStartFinalCelebration();
                }
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const progressBarFill = document.getElementById('progressBarFill');
            const loadingPercentage = document.getElementById('loadingPercentage');

            const audioPreloadPromises = [
                new Promise(res => {
                    bgMusic.addEventListener('canplaythrough', res, { once: true });
                    bgMusic.addEventListener('error', res, { once: true });
                    setTimeout(res, 2000);
                }),
                new Promise(res => {
                    clickSfx.addEventListener('canplaythrough', res, { once: true });
                    clickSfx.addEventListener('error', res, { once: true });
                    setTimeout(res, 2000);
                })
            ];

            Promise.all([
                preloadAssets(ASSETS, (loaded, total) => {
                    const percent = Math.round((loaded / total) * 100);
                    progressBarFill.style.width = `${percent}%`;
                    loadingPercentage.textContent = `${percent}%`;
                }),
                ...audioPreloadPromises
            ]).then(() => {
                setTimeout(onLoadingFinished, 500);
            });
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered:', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
